# ====================== ECB HTTP（RestTemplate / WebClient + 超时与简单重试）======================
# REST_TEMPLATE | WEB_CLIENT_ASYNC
currency.ecb.client=REST_TEMPLATE
currency.ecb.url=https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
currency.ecb.connect-timeout=10s
currency.ecb.read-timeout=30s
currency.ecb.max-attempts=3
currency.ecb.retry-backoff=500ms